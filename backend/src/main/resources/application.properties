spring.application.name=appointment-booking

# Database Connection (Docker PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/appointment_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL Auto (creates and updates tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=9a4f2c8d7e1b5a3f6c8d0e2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d
jwt.expiration-ms=86400000
